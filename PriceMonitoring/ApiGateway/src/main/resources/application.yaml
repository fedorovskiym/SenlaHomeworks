server:
  port: 8080

spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user-service/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/product-service/**