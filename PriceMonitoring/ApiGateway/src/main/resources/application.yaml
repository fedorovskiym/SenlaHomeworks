server:
  port: 8080

spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/user-service/**

            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/product-service/**